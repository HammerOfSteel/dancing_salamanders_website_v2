name: Deploy Website to Production

# ── Manual trigger only ────────────────────────────────────────────────────
# Add  push: { branches: [main] }  once the server has been inspected and
# the nginx site config / port confirmed.
on:
  workflow_dispatch:

# ── Required GitHub Secrets ────────────────────────────────────────────────
# DEPLOY_HOST       — 129.151.193.219 (same server as music visualizer)
# DEPLOY_USER       — ubuntu or ubuntusthlm (confirm from server)
# DEPLOY_SSH_KEY    — private key (contents of super_secret_just_for_you.txt)
# CERTBOT_EMAIL     — email for Let's Encrypt
#
# ── TODO before first run ──────────────────────────────────────────────────
# 1. SSH in and check:
#    - existing docker-compose services  (sudo docker ps)
#    - existing nginx sites              (ls /etc/nginx/sites-enabled/)
#    - port 3005 availability            (ss -tlnp | grep 3005)
# 2. Confirm / adjust:
#    - DOMAIN below (DNS set up: dancingsalamanders.com → 129.151.193.219)
#    - port in docker-compose.prod.yml (3007 — 3005 is livlust, 3006 is visualizer)
#    - DEPLOY_USER (ubuntu or ubuntusthlm)
# 3. .env.production on the server must contain:
#    NEXT_PUBLIC_VISUALIZER_URL=https://music.dancingsalamanders.com

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            REPO_URL="https://github.com/HammerOfSteel/dancing_salamanders_website_v2.git"
            DEPLOY_DIR="/opt/dancing-salamanders"
            DOMAIN="dancingsalamanders.com"          # TODO: confirm domain
            NGINX_SITE="/etc/nginx/sites-available/${DOMAIN}"
            NGINX_ENABLED="/etc/nginx/sites-enabled/${DOMAIN}"

            # ── 1. Clone or pull latest code ──────────────────────────────
            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              sudo git clone "${REPO_URL}" "${DEPLOY_DIR}"
            else
              cd "${DEPLOY_DIR}"
              sudo git fetch origin main
              sudo git reset --hard origin/main
            fi

            cd "${DEPLOY_DIR}"

            # ── 2. Build and start production containers ──────────────────
            sudo docker compose -f docker-compose.prod.yml up --build -d

            # ── 3. Install nginx site config (first deploy only) ──────────
            if [ ! -f "${NGINX_SITE}" ]; then
              sudo cp "${DEPLOY_DIR}/deploy/nginx-website.conf" "${NGINX_SITE}"
              sudo ln -sf "${NGINX_SITE}" "${NGINX_ENABLED}"
              sudo nginx -t
              sudo systemctl reload nginx
              echo "Nginx site installed for ${DOMAIN}."
            fi

            # ── 4. Obtain TLS certificate (once per domain) ───────────────
            if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
              sudo certbot --nginx -d "${DOMAIN}" -d "www.${DOMAIN}" \
                --non-interactive --agree-tos \
                --email "${{ secrets.CERTBOT_EMAIL }}"
              echo "Certificate obtained for ${DOMAIN}."
            fi

            # ── 5. Clean up dangling images ────────────────────────────────
            sudo docker image prune -f

            echo "Deployment complete: https://${DOMAIN}"
