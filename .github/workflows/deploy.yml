name: Deploy Website to Production

# Auto-deploy on push to main, or trigger manually
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub Secrets:
#   DEPLOY_HOST     — 129.151.193.219
#   DEPLOY_USER     — ubuntu
#   DEPLOY_SSH_KEY  — private key (contents of super_secret_just_for_you.txt)
#
# Note: .env.production must already exist at /opt/dancing-salamanders/.env.production
# (created once manually on the server — never committed to git).
# The visualizer runs independently at /opt/music-visualizer — no need to redeploy it here.

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/opt/dancing-salamanders"

            # 1. Pull latest code
            cd "${DEPLOY_DIR}"
            git fetch origin main
            git reset --hard origin/main

            # 2. Rebuild app image and restart containers
            sudo docker compose -f docker-compose.prod.yml build app
            sudo docker compose -f docker-compose.prod.yml up -d

            # 3. Clean up dangling images
            sudo docker image prune -f

            echo "Deployment complete: https://dancingsalamanders.com"
