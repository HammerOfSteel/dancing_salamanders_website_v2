# Production compose — binds only to localhost so the host's nginx can proxy.
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
#
# Host nginx (e.g. /etc/nginx/sites-available/dancingsalamanders.com) should
# proxy_pass http://127.0.0.1:3005;   (or whatever port is chosen below)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Points at the live visualizer subdomain
        NEXT_PUBLIC_VISUALIZER_URL: https://music.dancingsalamanders.com
    expose:
      - "3000"
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - ./public/music:/app/public/music:ro
      - ./public/images:/app/public/images:ro
      - ./public/audiobooks:/app/public/audiobooks:ro
      - ./public/manga:/app/public/manga:ro

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3007:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
