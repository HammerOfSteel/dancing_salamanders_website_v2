# Nginx site config for music.dancingsalamanders.com
# Points at the existing music-visualizer container already running on 127.0.0.1:3006
#
# Install to:  /etc/nginx/sites-available/music.dancingsalamanders.com
# Enable with: ln -s /etc/nginx/sites-available/music.dancingsalamanders.com \
#                     /etc/nginx/sites-enabled/
# Certbot will add HTTPS block automatically.

server {
    listen 80;
    server_name music.dancingsalamanders.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
