# Nginx site config for the Dancing Salamanders website
# -------------------------------------------------------
# Server: 129.151.193.219 (same box as music.dancingsalamanders.com / visualizer)
# Domain: dancingsalamanders.com  (DNS already points to 129.151.193.219)
# Port:   3007  (3005=livlust, 3006=visualizer — no conflict)
#
# Install to:  /etc/nginx/sites-available/dancingsalamanders.com
# Enable with: ln -s /etc/nginx/sites-available/dancingsalamanders.com \
#                     /etc/nginx/sites-enabled/
# Then:        nginx -t && systemctl reload nginx
# Certbot will add the HTTPS block and redirect automatically.
#
# docker-compose.prod.yml binds nginx to 127.0.0.1:3005

server {
    listen 80;
    server_name dancingsalamanders.com www.dancingsalamanders.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
