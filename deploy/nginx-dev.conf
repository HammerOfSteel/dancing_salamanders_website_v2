# Nginx site config for dev.dancingsalamanders.com
# -------------------------------------------------------
# Domain: dev.dancingsalamanders.com (staging copy on the one.com host)
# Port:   3008 (127.0.0.1:3008 — see docker-compose.prod.yml NGINX_PORT)
#
# Install to:  /etc/nginx/sites-available/dev.dancingsalamanders.com
# Enable with: ln -s /etc/nginx/sites-available/dev.dancingsalamanders.com \
#                     /etc/nginx/sites-enabled/
# Then:        nginx -t && systemctl reload nginx
# Certbot will add the HTTPS block and redirect automatically.

server {
    listen 80;
    server_name dev.dancingsalamanders.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
