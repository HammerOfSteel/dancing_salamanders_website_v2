services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — points at the local visualizer container
        NEXT_PUBLIC_VISUALIZER_URL: http://localhost:3006
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      # Music files live on the host — add albums here without rebuilding
      - ./public/music:/app/public/music:ro
      # Book cover images
      - ./public/images:/app/public/images:ro
      # Manga and audiobooks — large media, mounted not baked
      - ./public/manga:/app/public/manga:ro
      - ./public/audiobooks:/app/public/audiobooks:ro
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - visualizer

  visualizer:
    build:
      context: ../music-visualizer
      dockerfile: Dockerfile
    ports:
      - "3006:80"
    restart: unless-stopped
